<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Human ESP Multi</title>
<script src="https://cdn.jsdelivr.net/npm/rtmlib-ts@0.1.0/dist/rtmlib-ts.umd.js" crossorigin="anonymous"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family: ui-monospace, Consolas, monospace; color:#e6e6e6; }
#app { position:relative; width:100vw; height:100vh; }
#video, #overlay { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
#video { opacity:1; }
#overlay { pointer-events:none; }
#avatarToggle { position:absolute; top:12px; right:12px; z-index:20; width:48px; height:48px; border-radius:50%; border:2px solid rgba(0,255,136,0.6); background:#111; cursor:pointer; overflow:hidden; box-shadow:0 0 12px rgba(0,255,136,0.35); }
#avatarToggle img { width:100%; height:100%; object-fit:cover; }
#panel { position:absolute; top:12px; left:12px; z-index:10; width:260px; background:rgba(14,14,18,0.88); border:1px solid rgba(120,140,180,0.25); border-radius:10px; backdrop-filter:blur(8px); font-size:13px; user-select:none; transition:opacity .2s; }
#panel.hidden { opacity:0; pointer-events:none; }
#tabs { display:flex; border-bottom:1px solid rgba(120,140,180,0.2); }
.tab { flex:1; background:transparent; border:0; color:#8899aa; padding:8px 6px; font-family:inherit; font-size:12px; cursor:pointer; text-transform:uppercase; }
.tab.active { color:#00ff88; box-shadow:inset 0 -2px 0 #00ff88; }
.tab-content { display:none; padding:10px 12px; }
.tab-content.active { display:block; }
.tab-content label { display:flex; align-items:center; justify-content:space-between; padding:6px 0; color:#c8d2dd; cursor:pointer; gap:8px; }
.tab-content input[type="checkbox"] { appearance:none; width:32px; height:18px; background:#2a3340; border-radius:9px; position:relative; cursor:pointer; transition:0.2s; flex-shrink:0; }
.tab-content input[type="checkbox"]::after { content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; background:#667; border-radius:50%; transition:0.2s; }
.tab-content input[type="checkbox"]:checked { background:#00aa66; }
.tab-content input[type="checkbox"]:checked::after { left:16px; background:#fff; }
.divider { height:1px; background:rgba(120,140,180,0.15); margin:8px 0; }
.color-row { display:flex; flex-direction:column; gap:6px; padding:6px 0; }
.color-row .lbl { color:#c8d2dd; font-size:12px; }
.swatches { display:flex; gap:6px; }
.swatch { width:22px; height:22px; border-radius:50%; border:2px solid rgba(255,255,255,0.15); cursor:pointer; transition:transform .12s; }
.swatch.active { border-color:#fff; box-shadow:0 0 8px rgba(255,255,255,0.5); }
.swatch:hover { transform:scale(1.12); }
#enemyRow { display:flex; justify-content:space-between; align-items:center; padding:6px 0; color:#c8d2dd; }
#enemyCount { min-width:28px; text-align:center; padding:2px 8px; background:rgba(255,51,85,0.15); border:1px solid rgba(255,51,85,0.5); color:#ff3355; border-radius:6px; font-weight:bold; }
#enemyCount.zero { background:rgba(120,140,180,0.1); border-color:rgba(120,140,180,0.3); color:#667; }
#status { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); font-size:11px; color:#8899aa; z-index:10; padding:4px 10px; background:rgba(0,0,0,0.55); border-radius:6px; }
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <button id="avatarToggle"><img src="https://cdn.phototourl.com/member/2026-10-30-29501151-13fe-4d9f-9038-d7907bdd3bf5.jpg" alt=""></button>
  <div id="panel">
    <div id="tabs">
      <button class="tab active" data-tab="esp">ESP</button>
      <button class="tab" data-tab="color">Màu</button>
    </div>
    <div class="tab-content active" id="tab-esp">
      <label><input type="checkbox" id="t-esp-box" checked> ESP Box</label>
      <label><input type="checkbox" id="t-esp-line" checked> ESP Line</label>
      <label><input type="checkbox" id="t-esp-skel" checked> ESP Skeleton</label>
      <label><input type="checkbox" id="t-esp-dist" checked> ESP Distance</label>
      <label><input type="checkbox" id="t-esp-enemies" checked> ESP Enemies</label>
      <div id="enemyRow"><span>Số người:</span><span id="enemyCount" class="zero">0</span></div>
      <div class="divider"></div>
      <label><input type="checkbox" id="t-mirror"> Mirror</label>
    </div>
    <div class="tab-content" id="tab-color">
      <div class="color-row" data-key="colorBox"><span class="lbl">Box</span><div class="swatches"></div></div>
      <div class="color-row" data-key="colorLine"><span class="lbl">Line</span><div class="swatches"></div></div>
      <div class="color-row" data-key="colorSkel"><span class="lbl">Skeleton</span><div class="swatches"></div></div>
      <div class="color-row" data-key="colorDist"><span class="lbl">Distance</span><div class="swatches"></div></div>
      <div class="divider"></div>
      <label>Độ dày: <input type="range" id="c-width" min="1" max="6" value="2"></label>
    </div>
  </div>
  <div id="status">đang tải model…</div>
</div>
<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const statusEl = document.getElementById('status');
const enemyEl = document.getElementById('enemyCount');

const PALETTE = ['#ff3355','#ffdd00','#ff66cc','#000000','#ffffff','#00ff88'];
const state = {
  box:true, line:true, skeleton:true, distance:true, enemies:true, mirror:false,
  colorBox:'#00ff88', colorLine:'#ff3355', colorSkel:'#00ddff', colorDist:'#ffdd00', width:2
};

// CONNECTIONS NỐI LIỀN: đầu → thân → chân
const CONNECTIONS = [
  // mặt
  [0,1],[1,2],[2,3],[3,7],[0,4],[4,5],[5,6],[6,8],
  // đầu nối thân (cổ → vai)
  [0,11],[0,12],
  // vai → khuỷu → cổ tay
  [11,13],[13,15],[12,14],[14,16],
  // vai → hông (thân liền)
  [11,23],[12,24],[23,24],
  // hông → gối → cổ chân (chân liền)
  [23,25],[25,27],[24,26],[26,28],
  // bàn chân
  [27,29],[29,31],[27,31],[28,30],[30,32],[28,32]
];

function resize() {
  overlay.width = innerWidth * devicePixelRatio;
  overlay.height = innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener('resize', resize); resize();

function bindToggle(id, key) { const el=document.getElementById(id); const f=()=>state[key]=el.checked; el.addEventListener('change',f); f(); }
bindToggle('t-esp-box','box'); bindToggle('t-esp-line','line');
bindToggle('t-esp-skel','skeleton'); bindToggle('t-esp-dist','distance');
bindToggle('t-esp-enemies','enemies'); bindToggle('t-mirror','mirror');

document.querySelectorAll('.color-row').forEach(row => {
  const key = row.dataset.key; const holder = row.querySelector('.swatches');
  PALETTE.forEach(c => {
    const b = document.createElement('button'); b.className='swatch'; b.style.background=c;
    if (c.toLowerCase()===state[key]) b.classList.add('active');
    b.onclick = () => { state[key]=c; holder.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active')); b.classList.add('active'); };
    holder.appendChild(b);
  });
});
document.getElementById('c-width').oninput = e => state.width = +e.target.value;

document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active'); document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  };
});

const avatarBtn = document.getElementById('avatarToggle');
avatarBtn.onclick = () => { document.getElementById('panel').classList.toggle('hidden'); };

let poseDetector = null;
let lastPeople = [];

async function init() {
  statusEl.textContent = 'đang tải detector…';
  // rtmlib-ts: ObjectDetector multi-person + PoseDetector per crop
  const rtmlib = window.rtmlibTs || window.rtmlib;
  if (!rtmlib) { statusEl.textContent = 'lỗi: rtmlib chưa load'; return; }

  // MediaPipe ObjectDetector (person-only, nhanh)
  const detector = new rtmlib.ObjectDetector({
    detectorType: 'mediapipe',
    mediaPipeScoreThreshold: 0.5,
    classes: ['person']
  });
  await detector.init();
  poseDetector = detector;
  statusEl.textContent = 'model OK — đang detect';

  // camera
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width:{ideal:1280}, height:{ideal:720} }, audio:false
    });
    video.srcObject = stream; await video.play();
  } catch(e) { statusEl.textContent = 'camera lỗi: '+e.message; return; }

  loop();
}

let lastLabel = 0;
function loop(now=performance.now()) {
  if (poseDetector && video.readyState >= 2) {
    // vẽ frame hiện tại trước
    ctx.clearRect(0,0,innerWidth,innerHeight);

    // detect persons từ video frame
    poseDetector.detectFromVideo(video).then(res => {
      const people = res?.detections || res?.boxes || [];
      lastPeople = people.filter(d => (d.className==='person' || d.class==='person' || d.category==='person') && (d.confidence||d.score||0) > 0.4);
      drawPeople(lastPeople, now);
    }).catch(()=>{});
  }
  requestAnimationFrame(loop);
}

function drawPeople(people, now) {
  const w = innerWidth, h = innerHeight, sw = state.width;

  people.forEach((p, idx) => {
    // bounding box (x,y,w,h) hoặc (x1,y1,x2,y2)
    let bx = p.x ?? p.bbox?.[0] ?? p.x1 ?? 0;
    let by = p.y ?? p.bbox?.[1] ?? p.y1 ?? 0;
    let bw = p.width ?? (p.bbox?.[2] ?? p.x2 ?? 0) - bx;
    let bh = p.height ?? (p.bbox?.[3] ?? p.y2 ?? 0) - by;
    if (state.mirror) bx = w - bx - bw;

    if (state.box) {
      ctx.strokeStyle = state.colorBox; ctx.lineWidth = sw;
      ctx.strokeRect(bx, by, bw, bh);
    }
    if (state.line) {
      ctx.strokeStyle = state.colorLine; ctx.lineWidth = sw;
      ctx.beginPath(); ctx.moveTo(w/2, h); ctx.lineTo(bx+bw/2, by); ctx.stroke();
    }
    if (state.distance) {
      const ratio = bh / h;
      const meters = Math.max(0.4, (1.6/ratio)*0.45);
      ctx.fillStyle = state.colorDist; ctx.font = `${12+sw}px monospace`;
      ctx.fillText(`${meters.toFixed(1)}m`, bx, by-6);
    }
    // Skeleton: nếu detector trả keypoints thì vẽ
    if (state.skeleton && (p.keypoints || p.landmarks)) {
      const lm = p.keypoints || p.landmarks;
      ctx.strokeStyle = state.colorSkel; ctx.lineWidth = sw; ctx.lineCap='round';
      ctx.beginPath();
      for (const [a,b] of CONNECTIONS) {
        const pa = lm[a], pb = lm[b];
        if (!pa || !pb || (pa.visibility!==undefined && pa.visibility < 0.3)) continue;
        let ax = pa.x, ay = pa.y, bx2 = pb.x, by2 = pb.y;
        if (state.mirror) { ax = 1-ax; bx2 = 1-bx2; }
        ctx.moveTo(ax*w, ay*h); ctx.lineTo(bx2*w, by2*h);
      }
      ctx.stroke();
      // đầu tròn
      const nose = lm[0];
      if (nose) {
        let nx = nose.x, ny = nose.y; if (state.mirror) nx = 1-nx;
        ctx.fillStyle = state.colorSkel;
        ctx.beginPath(); ctx.arc(nx*w, ny*h, sw+3, 0, Math.PI*2); ctx.fill();
      }
    }
  });

  if (state.enemies && now - lastLabel > 200) {
    lastLabel = now;
    enemyEl.textContent = people.length;
    enemyEl.classList.toggle('zero', people.length===0);
  }
}

init();
</script>
</body>
</html>
