<!DOCTYPE html>
<html>
<head>
    <title>Telegram Spam</title>
</head>
<body>
    <input type="text" id="token" placeholder="Bot Token" value="123456:ABC-DEF">
    <input type="text" id="chat_id" placeholder="Chat ID hoặc @username" value="@target">
    <textarea id="message" placeholder="Nội dung spam">Spam!</textarea>
    <button onclick="spam()">Gửi spam</button>
    <div id="log"></div>
    <script>
        function spam() {
            const token = document.getElementById('token').value;
            const chat_id = document.getElementById('chat_id').value;
            const msg = document.getElementById('message').value;
            const log = document.getElementById('log');
            const url = `https://api.telegram.org/bot${token}/sendMessage`;
            const data = { chat_id: chat_id, text: msg };
            let count = 0;
            const interval = setInterval(() => {
                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                .then(res => res.json())
                .then(json => {
                    count++;
                    log.innerHTML = `Đã gửi: ${count} tin nhắn`;
                    if (!json.ok) {
                        clearInterval(interval);
                        log.innerHTML += `\nLỗi: ${json.description}`;
                    }
                })
                .catch(err => {
                    clearInterval(interval);
                    log.innerHTML += `\nLỗi kết nối: ${err}`;
                });
            }, 100); // 10 tin nhắn/giây (giới hạn 30/s, nên để 200ms để an toàn)
            setTimeout(() => clearInterval(interval), 30000); // tự động dừng sau 30s
        }
    </script>
</body>
</html>
