<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC79 VIP TOOL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
        body { background: #000; overflow: hidden; height: 100vh; }

        .game-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        iframe { width: 100%; height: 100%; border: none; }

        .tool-wrapper {
            position: fixed;
            top: 15%; left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            align-items: center;
            cursor: move;
            touch-action: none;
        }

        .robot-img {
            width: 130px; 
            height: auto;
            margin-right: -25px;
            z-index: 10;
        }

        /* KHUNG SỐ KIỂU MỚI SÁNG TẠO (CYBERPUNK HUD) */
        .content-box {
            position: relative;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.9), rgba(27, 38, 59, 0.95));
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 16px 35px 16px 25px;
            border-radius: 16px; 
            border: 2px solid rgba(0, 243, 255, 0.4);
            color: #fff;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.25), inset 0 0 15px rgba(0, 243, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 240px;
        }

        .content-box::before {
            content: "LC79 VIP SYSTEM";
            position: absolute;
            top: -9px;
            left: 20px;
            background: #0d1b2a;
            padding: 0 8px;
            font-size: 9px;
            font-weight: 700;
            color: #00f3ff;
            letter-spacing: 1px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 4px;
        }

        .line-1 { 
            font-size: 18px; 
            font-weight: 800; 
            white-space: nowrap; 
            color: #ffffff;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
            letter-spacing: 0.5px;
        }
        
        .line-2 { 
            font-size: 11px; 
            color: #00f3ff;
            margin-top: 4px; 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .close-btn { 
            position: absolute; 
            top: 8px; 
            right: 12px; 
            color: #ff4757; 
            font-size: 16px; 
            cursor: pointer;
            transition: 0.2s;
        }
        .close-btn:hover {
            color: #ff6b81;
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <div class="game-view">
        <iframe src="https://lc79b.bet/"></iframe>
    </div>

    <div class="tool-wrapper" id="dragTool">
        <!-- Ảnh robot (có thể thay link src nếu muốn đổi ảnh khác) -->
        <img src="https://i.postimg.cc/ZqwY1452/Chu-the.png" class="robot-img" alt="robot">
        
        <div class="content-box">
            <div class="close-btn" onclick="this.parentElement.parentElement.style.display='none'">&times;</div>
            <div class="line-1" id="val_p">#999999 : ...</div>
            <div class="line-2" id="val_c">Độ tin cậy : --%</div>
        </div>
    </div>

    <script>
        const API = "https://api-lc79-md5-thanhnhan-vip.onrender.com/api";
        const PROXY = "https://api.allorigins.win/get?url=";
        let lastP = "";

        async function update() {
            try {
                const r = await fetch(`${PROXY}${encodeURIComponent(API)}&t=${Date.now()}`);
                const j = await r.json();
                const d = JSON.parse(j.contents);

                if (d && d.phien) {
                    const nextP = parseInt(d.phien) + 1;
                    if (d.phien !== lastP) {
                        lastP = d.phien;
                        const res = d.du_doan.toUpperCase();
                        let ketqua = (res.includes("TAI") || res.includes("TÀI")) ? "Tài" : "Xỉu";
                        
                        document.getElementById("val_p").innerText = `#${nextP} : ${ketqua}`;
                        
                        const rate = (Math.random() * (98 - 70) + 70).toFixed(2);
                        document.getElementById("val_c").innerText = `Độ tin cậy : ${rate}%`;
                    }
                }
            } catch (e) {}
        }

        const tool = document.getElementById("dragTool");
        let active = false, startX, startY, initX, initY;

        const mStart = (e) => {
            active = true;
            const t = e.type.includes('touch') ? e.touches[0] : e;
            startX = t.clientX; startY = t.clientY;
            initX = tool.offsetLeft; initY = tool.offsetTop;
            tool.style.transition = 'none';
        };

        const mMove = (e) => {
            if (!active) return;
            const t = e.type.includes('touch') ? e.touches[0] : e;
            tool.style.left = (initX + (t.clientX - startX)) + 'px';
            tool.style.top = (initY + (t.clientY - startY)) + 'px';
            tool.style.transform = "none";
        };

        tool.addEventListener('mousedown', mStart);
        tool.addEventListener('touchstart', mStart, { passive: true });
        document.addEventListener('mousemove', mMove);
        document.addEventListener('touchmove', mMove, { passive: false });
        document.addEventListener('mouseup', () => active = false);
        document.addEventListener('touchend', () => active = false);

        setInterval(update, 2000);
        update();
    </script>
</body>
</html>
