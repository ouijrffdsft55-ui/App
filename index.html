<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Human ESP Multi</title>

<!-- Load thư viện chính chủ Google -->
<script type="module">
import { PoseLandmarker, FilesetResolver } 
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12";
window.PoseLandmarker = PoseLandmarker;
window.FilesetResolver = FilesetResolver;
window.dispatchEvent(new Event('mp-loaded'));
</script>

<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family: ui-monospace, Consolas, monospace; color:#e6e6e6; }
#app { position:relative; width:100vw; height:100vh; background:#000; }
#video, #overlay { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
#video { opacity:1; }
#overlay { pointer-events:none; }

#startScreen { position:absolute; inset:0; z-index:50; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
#startBtn { padding:14px 28px; font-size:16px; background:#00ff88; color:#000; border:none; border-radius:8px; font-weight:bold; cursor:pointer; }
#startBtn:active { transform:scale(0.96); }
#startText { color:#8899aa; font-size:13px; text-align:center; max-width:280px; line-height:1.5; }

#avatarToggle { position:absolute; top:12px; right:12px; z-index:20; width:48px; height:48px; border-radius:50%; border:2px solid rgba(0,255,136,0.6); background:#111; cursor:pointer; overflow:hidden; box-shadow:0 0 12px rgba(0,255,136,0.35); }
#avatarToggle img { width:100%; height:100%; object-fit:cover; }

#panel { position:absolute; top:12px; left:12px; z-index:10; width:260px; background:rgba(14,14,18,0.88); border:1px solid rgba(120,140,180,0.25); border-radius:10px; backdrop-filter:blur(8px); font-size:13px; user-select:none; transition:opacity .2s; }
#panel.hidden { opacity:0; pointer-events:none; }
#tabs { display:flex; border-bottom:1px solid rgba(120,140,180,0.2); }
.tab { flex:1; background:transparent; border:0; color:#8899aa; padding:8px 6px; font-family:inherit; font-size:12px; cursor:pointer; text-transform:uppercase; }
.tab.active { color:#00ff88; box-shadow:inset 0 -2px 0 #00ff88; }
.tab-content { display:none; padding:10px 12px; }
.tab-content.active { display:block; }
.tab-content label { display:flex; align-items:center; justify-content:space-between; padding:6px 0; color:#c8d2dd; cursor:pointer; gap:8px; }
.tab-content input[type="checkbox"] { appearance:none; width:32px; height:18px; background:#2a3340; border-radius:9px; position:relative; cursor:pointer; transition:0.2s; flex-shrink:0; }
.tab-content input[type="checkbox"]::after { content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; background:#667; border-radius:50%; transition:0.2s; }
.tab-content input[type="checkbox"]:checked { background:#00aa66; }
.tab-content input[type="checkbox"]:checked::after { left:16px; background:#fff; }
.divider { height:1px; background:rgba(120,140,180,0.15); margin:8px 0; }
.color-row { display:flex; flex-direction:column; gap:6px; padding:6px 0; }
.color-row .lbl { color:#c8d2dd; font-size:12px; }
.swatches { display:flex; gap:6px; }
.swatch { width:22px; height:22px; border-radius:50%; border:2px solid rgba(255,255,255,0.15); cursor:pointer; transition:transform .12s; }
.swatch.active { border-color:#fff; box-shadow:0 0 8px rgba(255,255,255,0.5); }
.swatch:hover { transform:scale(1.12); }
#enemyRow { display:flex; justify-content:space-between; align-items:center; padding:6px 0; color:#c8d2dd; }
#enemyCount { min-width:28px; text-align:center; padding:2px 8px; background:rgba(255,51,85,0.15); border:1px solid rgba(255,51,85,0.5); color:#ff3355; border-radius:6px; font-weight:bold; }
#enemyCount.zero { background:rgba(120,140,180,0.1); border-color:rgba(120,140,180,0.3); color:#667; }
#status { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); font-size:11px; color:#8899aa; z-index:10; padding:4px 10px; background:rgba(0,0,0,0.55); border-radius:6px; }
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  
  <div id="startScreen">
    <button id="startBtn">BẬT CAMERA</button>
    <div id="startText">Nhấn để cấp quyền camera</div>
  </div>

  <button id="avatarToggle"><img src="https://cdn.phototourl.com/member/2026-10-30-29501151-13fe-4d9f-9038-d7907bdd3bf5.jpg" alt=""></button>
  
  <div id="panel" class="hidden">
    <div id="tabs">
      <button class="tab active" data-tab="esp">ESP</button>
      <button class="tab" data-tab="color">Màu</button>
    </div>
    <div class="tab-content active" id="tab-esp">
      <label><input type="checkbox" id="t-esp-box" checked> ESP Box</label>
      <label><input type="checkbox" id="t-esp-line" checked> ESP Line</label>
      <label><input type="checkbox" id="t-esp-skel" checked> ESP Skeleton</label>
      <label><input type="checkbox" id="t-esp-dist" checked> ESP Distance</label>
      <label><input type="checkbox" id="t-esp-enemies" checked> ESP Enemies</label>
      <div id="enemyRow"><span>Số người:</span><span id="enemyCount" class="zero">0</span></div>
      <div class="divider"></div>
      <label><input type="checkbox" id="t-mirror"> Mirror camera</label>
    </div>
    <div class="tab-content" id="tab-color">
      <div class="color-row" data-key="colorBox"><span class="lbl">Box</span><div class="swatches"></div></div>
      <div class="color-row" data-key="colorLine"><span class="lbl">Line</span><div class="swatches"></div></div>
      <div class="color-row" data-key="colorSkel"><span class="lbl">Skeleton</span><div class="swatches"></div></div>
      <div class="color-row" data-key="colorDist"><span class="lbl">Distance</span><div class="swatches"></div></div>
      <div class="divider"></div>
      <label>Độ dày nét: <input type="range" id="c-width" min="1" max="6" value="2"></label>
    </div>
  </div>
  <div id="status">chờ bật camera…</div>
</div>

<script>
window.addEventListener('mp-loaded', initApp);

function initApp() {
  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const ctx = overlay.getContext('2d');
  const statusEl = document.getElementById('status');
  const enemyEl = document.getElementById('enemyCount');
  const startScreen = document.getElementById('startScreen');
  const startBtn = document.getElementById('startBtn');

  const PALETTE = ['#ff3355','#ffdd00','#ff66cc','#000000','#ffffff','#00ff88'];
  const state = {
    box:true, line:true, skeleton:true, distance:true, enemies:true, mirror:false,
    colorBox:'#00ff88', colorLine:'#ff3355', colorSkel:'#00ddff', colorDist:'#ffdd00', width:2
  };

  // Skeleton liền mạch (33 khớp)
  const CONNECTIONS = [
    [0,1],[1,2],[2,3],[3,7],[0,4],[4,5],[5,6],[6,8],
    [0,11],[0,12],[11,13],[13,15],[12,14],[14,16],
    [11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],
    [27,29],[29,31],[27,31],[28,30],[30,32],[28,32]
  ];

  function resize() {
    overlay.width = window.innerWidth * devicePixelRatio;
    overlay.height = window.innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  window.addEventListener('resize', resize); resize();

  function bindToggle(id, key) {
    const el = document.getElementById(id); const f = () => state[key] = el.checked;
    el.addEventListener('change', f); f();
  }
  bindToggle('t-esp-box','box'); bindToggle('t-esp-line','line');
  bindToggle('t-esp-skel','skeleton'); bindToggle('t-esp-dist','distance');
  bindToggle('t-esp-enemies','enemies'); bindToggle('t-mirror','mirror');

  document.querySelectorAll('.color-row').forEach(row => {
    const key = row.dataset.key; const holder = row.querySelector('.swatches');
    PALETTE.forEach(c => {
      const b = document.createElement('button'); b.className='swatch'; b.style.background=c;
      if (c.toLowerCase()===state[key]) b.classList.add('active');
      b.onclick = () => { state[key]=c; holder.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active')); b.classList.add('active'); };
      holder.appendChild(b);
    });
  });
  document.getElementById('c-width').oninput = e => state.width = +e.target.value;

  document.querySelectorAll('.tab').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
      btn.classList.add('active'); document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    };
  });
  document.getElementById('avatarToggle').onclick = () => document.getElementById('panel').classList.toggle('hidden');

  let poseLandmarker = null;
  let lastVideoTime = -1;
  let lastResults = [];
  
  // Quản lý bộ lọc mượt (Smooth Tracking)
  let trackedPeople = []; 
  let nextId = 0;

  async function loadModels() {
    statusEl.textContent = 'đang tải model AI…';
    const vision = await window.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm"
    );
    
    // Sử dụng trực tiếp Pose Landmarker hỗ trợ đa người (numPoses: 5)
    poseLandmarker = await window.PoseLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numPoses: 5 // Nhận diện tối đa 5 người 1 lúc
    });
    statusEl.textContent = 'model OK - chờ camera';
  }

  function detectLoop() {
    if (video.readyState < 2 || !poseLandmarker) {
      requestAnimationFrame(detectLoop); return;
    }
    
    const now = performance.now();
    // Chỉ chạy AI khi video có frame mới
    if (video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      
      const results = poseLandmarker.detectForVideo(video, now);
      
      if (results && results.landmarks && results.landmarks.length > 0) {
        // Lưu tạm kết quả raw
        lastResults = results.landmarks;
      } else {
        lastResults = [];
      }
    }

    drawFrame(now);
    requestAnimationFrame(detectLoop);
  }

  let lastLabel = 0;
  function drawFrame(now) {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const sw = state.width;
    ctx.clearRect(0, 0, w, h);

    // Làm mượt (Smooth Tracking) dựa trên khoảng cách khớp
    lastResults.forEach(lm => {
      // Tính tâm của người này
      let cx = 0, cy = 0, count = 0;
      lm.forEach(p => { if (p.visibility > 0.5) { cx += p.x; cy += p.y; count++; } });
      if (count === 0) return;
      cx /= count; cy /= count;

      // Tìm ID cũ gần nhất để kế thừa độ mượt
      let bestMatch = null;
      let minDist = 0.2; // khoảng cách tối đa để coi là cùng 1 người
      trackedPeople.forEach(p => {
        const dist = Math.hypot(p.cx - cx, p.cy - cy);
        if (dist < minDist) { minDist = dist; bestMatch = p; }
      });

      const alpha = 0.4; // Độ mượt (0.1 = mượt nhất, 1 = nhanh nhất)
      if (bestMatch) {
        // Cập nhật mượt
        for(let i=0; i<lm.length; i++) {
          if (!bestMatch.lm[i]) bestMatch.lm[i] = {x:0, y:0, visibility:0};
          bestMatch.lm[i].x += (lm[i].x - bestMatch.lm[i].x) * alpha;
          bestMatch.lm[i].y += (lm[i].y - bestMatch.lm[i].y) * alpha;
          bestMatch.lm[i].visibility = lm[i].visibility;
        }
        bestMatch.cx = cx; bestMatch.cy = cy; bestMatch.lost = 0;
      } else {
        // Tạo mới
        trackedPeople.push({ id: nextId++, lm: JSON.parse(JSON.stringify(lm)), cx, cy, lost: 0 });
      }
    });

    // Xóa những người đã biến mất khỏi frame (sau 10 frame ko thấy)
    trackedPeople.forEach(p => p.lost++);
    trackedPeople = trackedPeople.filter(p => p.lost < 10);

    // Vẽ
    trackedPeople.forEach(p => {
      const lm = p.lm;
      let minX = 1, minY = 1, maxX = 0, maxY = 0;
      let hasBody = false;

      lm.forEach(l => {
        if (l.visibility > 0.4) {
          hasBody = true;
          if (l.x < minX) minX = l.x;
          if (l.y < minY) minY = l.y;
          if (l.x > maxX) maxX = l.x;
          if (l.y > maxY) maxY = l.y;
        }
      });

      if (!hasBody) return;

      // Bọc Box khít cơ thể
      const padX = 0.02, padY = 0.02; // Lề rất nhỏ
      let box = { 
        x: Math.max(0, minX - padX), 
        y: Math.max(0, minY - padY), 
        w: Math.min(1, (maxX - minX) + padX*2), 
        h: Math.min(1, (maxY - minY) + padY*2) 
      };

      let bx = box.x * w;
      let by = box.y * h;
      let bw = box.w * w;
      let bh = box.h * h;

      if (state.mirror) {
        bx = w - bx - bw;
      }

      // 1. Vẽ Box
      if (state.box) {
        ctx.strokeStyle = state.colorBox; 
        ctx.lineWidth = sw;
        ctx.strokeRect(bx, by, bw, bh);
        
        // Viền góc (Corner Ticks)
        const t = Math.min(12, bw*0.2, bh*0.2);
        ctx.lineWidth = sw + 1.5;
        [[bx,by,1,1],[bx+bw,by,-1,1],[bx,by+bh,1,-1],[bx+bw,by+bh,-1,-1]].forEach(([cx,cy,dx,dy]) => {
          ctx.beginPath(); ctx.moveTo(cx+dx*t, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy+dy*t); ctx.stroke();
        });
      }

      // 2. Vẽ Distance
      if (state.distance) {
        const ratio = bh / h;
        const meters = Math.max(0.5, (1.7 / ratio) * 0.45); 
        ctx.fillStyle = state.colorDist; 
        ctx.font = `bold ${11+sw}px monospace`;
        ctx.textAlign = 'left';
        ctx.fillText(`${meters.toFixed(1)}m`, bx, by - 6);
      }

      // 3. Vẽ Line
      if (state.line) {
        ctx.strokeStyle = state.colorLine; 
        ctx.lineWidth = sw;
        ctx.beginPath(); 
        ctx.moveTo(w/2, h); 
        ctx.lineTo(bx + bw/2, by); 
        ctx.stroke();
      }

      // 4. Vẽ Skeleton
      if (state.skeleton) {
        ctx.strokeStyle = state.colorSkel; 
        ctx.lineWidth = sw; 
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        // Vẽ dây nối (xương)
        ctx.beginPath();
        CONNECTIONS.forEach(([a, b]) => {
          const p1 = lm[a], p2 = lm[b];
          if (p1 && p2 && p1.visibility > 0.4 && p2.visibility > 0.4) {
            let x1 = p1.x * w, y1 = p1.y * h;
            let x2 = p2.x * w, y2 = p2.y * h;
            if (state.mirror) { x1 = w-x1; x2 = w-x2; }
            ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
          }
        });
        ctx.stroke();

        // Đầu tròn (Mũi / Mắt)
        const headPoints = [0, 1, 2, 5]; // mũi, mắt trái, mắt phải
        let hx = 0, hy = 0, hc = 0;
        headPoints.forEach(idx => {
          if (lm[idx] && lm[idx].visibility > 0.4) { hx += lm[idx].x; hy += lm[idx].y; hc++; }
        });
        if (hc > 0) {
          hx = (hx/hc) * w; hy = (hy/hc) * h;
          if (state.mirror) hx = w - hx;
          ctx.fillStyle = state.colorSkel;
          ctx.beginPath(); 
          ctx.arc(hx, hy, Math.max(6, bh*0.08), 0, Math.PI*2); // Bán kính đầu co giãn theo cơ thể
          ctx.fill();
        }
      }
    });

    // Update Enemies Counter
    if (state.enemies && now - lastLabel > 200) {
      lastLabel = now;
      const count = trackedPeople.filter(p => p.lost === 0).length;
      enemyEl.textContent = count;
      enemyEl.classList.toggle('zero', count === 0);
    }
  }

  // Bắt đầu
  startBtn.onclick = async () => {
    startScreen.style.display = 'none';
    try {
      await loadModels();
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width:{ideal:1280}, height:{ideal:720} }, 
        audio: false
      });
      video.srcObject = stream; 
      await video.play();
      statusEl.textContent = 'đang detect…';
      detectLoop();
    } catch(e) {
      statusEl.textContent = 'lỗi: ' + e.message;
      alert('Lỗi Camera: ' + e.message);
    }
  };
}
</script>
</body>
</html>
