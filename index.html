<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web cá nhân · Duc Anh</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f8faff 0%, #eef2f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        .card {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 3.5rem;
            padding: 2.5rem 2.8rem;
            box-shadow: 0 30px 60px rgba(0, 20, 40, 0.12), 
                        0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: 0.3s ease;
            position: relative;
        }

        /* Menu hamburger - CHỈ HIỆN KHI CÓ ?edit=true */
        .menu-icon {
            position: absolute;
            top: 1.8rem;
            left: 2rem;
            cursor: pointer;
            z-index: 10;
            display: none;
            flex-direction: column;
            gap: 5px;
            padding: 4px;
        }

        .menu-icon.visible {
            display: flex;
        }

        .menu-icon span {
            display: block;
            width: 28px;
            height: 3px;
            background: #1f2d5a;
            border-radius: 6px;
            transition: 0.25s ease;
        }

        .menu-icon:hover span {
            background: #4a6cf7;
        }

        .menu-dropdown {
            position: absolute;
            top: 4.5rem;
            left: 2rem;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 1.5rem 1.8rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.5);
            min-width: 280px;
            display: none;
            z-index: 20;
            max-height: 80vh;
            overflow-y: auto;
        }

        .menu-dropdown.active {
            display: block;
        }

        .menu-dropdown label {
            display: block;
            font-weight: 600;
            color: #0b1a3a;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .menu-dropdown label:first-child {
            margin-top: 0;
        }

        .menu-dropdown input[type="text"],
        .menu-dropdown input[type="url"] {
            width: 100%;
            padding: 0.6rem 1rem;
            border-radius: 1rem;
            border: 1px solid #dce3ed;
            background: white;
            font-size: 0.9rem;
            margin-top: 0.3rem;
            transition: 0.2s;
        }

        .menu-dropdown input[type="text"]:focus,
        .menu-dropdown input[type="url"]:focus {
            outline: none;
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.1);
        }

        .menu-dropdown input[type="file"] {
            margin-top: 0.3rem;
            font-size: 0.85rem;
        }

        .menu-dropdown .btn-update {
            background: #4a6cf7;
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 2rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.2rem;
            width: 100%;
            transition: 0.2s;
            font-size: 0.95rem;
        }

        .menu-dropdown .btn-update:hover {
            background: #3a5bd9;
            transform: scale(1.02);
        }

        .menu-dropdown .social-link-input {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.5rem;
        }

        .menu-dropdown .social-link-input i {
            width: 1.5rem;
            font-size: 1.1rem;
            color: #4a6cf7;
        }

        .menu-dropdown .social-link-input input {
            flex: 1;
        }

        .mypages-section {
            margin-top: 1rem;
            padding: 0.8rem 1rem;
            background: rgba(74, 108, 247, 0.06);
            border-radius: 1rem;
            border: 1px solid rgba(74, 108, 247, 0.12);
        }

        .mypages-section .mypages-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            color: #0b1a3a;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .mypages-section .mypages-header i {
            color: #4a6cf7;
        }

        .mypages-section .mypages-link-box {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .mypages-section .mypages-link-box input {
            flex: 1;
            padding: 0.5rem 0.8rem;
            border-radius: 0.8rem;
            border: 1px solid #dce3ed;
            background: white;
            font-size: 0.85rem;
            color: #1f2d5a;
            cursor: default;
        }

        .mypages-section .mypages-link-box .copy-btn {
            background: #4a6cf7;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.8rem;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.2s;
            white-space: nowrap;
        }

        .mypages-section .mypages-link-box .copy-btn:hover {
            background: #3a5bd9;
            transform: scale(1.02);
        }

        .mypages-section .mypages-link-box .copy-btn.copied {
            background: #22c55e;
        }

        .mypages-note {
            font-size: 0.75rem;
            color: #5a6b8a;
            margin-top: 0.4rem;
        }

        .status-toggle-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.5rem;
            padding: 0.3rem 0;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
            background: #d1d9e6;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .toggle-switch.active {
            background: #22c55e;
        }

        .toggle-switch .toggle-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .toggle-switch.active .toggle-slider {
            left: 25px;
        }

        .status-label {
            font-weight: 500;
            color: #1f2d5a;
            font-size: 0.95rem;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            align-items: center;
            justify-items: center;
            margin-top: 0.5rem;
        }

        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .avatar-wrapper {
            width: 100%;
            max-width: 200px;
            aspect-ratio: 1/1;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a6cf7, #9d7aff);
            padding: 5px;
            box-shadow: 0 15px 35px rgba(74, 108, 247, 0.25);
            transition: 0.25s;
            cursor: default;
        }

        .avatar-wrapper:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 45px rgba(74, 108, 247, 0.35);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: white;
            display: block;
        }

        .name-title {
            margin-top: 1.2rem;
        }

        .name-title h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #0b1a3a;
            letter-spacing: -0.5px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.3rem;
            padding: 0.35rem 1.2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0,0,0,0.05);
            transition: 0.2s;
            background: rgba(255,255,255,0.5);
        }

        .status-badge .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transition: 0.3s;
        }

        .status-badge.online .status-dot {
            background: #22c55e;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
        }

        .status-badge.offline .status-dot {
            background: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        .status-badge.online {
            color: #15803d;
            border-color: rgba(34, 197, 94, 0.2);
        }

        .status-badge.offline {
            color: #b91c1c;
            border-color: rgba(239, 68, 68, 0.2);
        }

        .social-links {
            display: flex;
            gap: 1rem;
            margin-top: 1.2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .social-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 30px;
            background: white;
            color: #1f2d5a;
            font-size: 1.3rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.04);
            transition: 0.2s ease;
            border: 1px solid rgba(0,0,0,0.02);
            text-decoration: none;
        }

        .social-links a:hover {
            background: #4a6cf7;
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(74, 108, 247, 0.3);
            border-color: #4a6cf7;
        }

        .music-player-box {
            margin-top: 1.2rem;
            width: 100%;
            max-width: 450px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(8px);
            border-radius: 1.5rem;
            padding: 1.2rem 1.5rem;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }

        .music-player-box .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #5a6b8a;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .music-player-box .player-header i {
            color: #4a6cf7;
        }

        .music-player-box .now-playing {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.8rem;
            padding: 0.6rem 0.8rem;
            background: rgba(255,255,255,0.4);
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .music-player-box .now-playing .thumb {
            width: 48px;
            height: 48px;
            border-radius: 0.8rem;
            background: linear-gradient(135deg, #4a6cf7, #9d7aff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .music-player-box .now-playing .info {
            flex: 1;
            text-align: left;
        }

        .music-player-box .now-playing .info .title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #0b1a3a;
        }

        .music-player-box .now-playing .info .sub {
            font-size: 0.75rem;
            color: #5a6b8a;
        }

        .music-player-box .now-playing .controls {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .music-player-box .now-playing .controls button {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #1f2d5a;
            cursor: pointer;
            transition: 0.2s;
            padding: 4px;
        }

        .music-player-box .now-playing .controls button:hover {
            color: #4a6cf7;
            transform: scale(1.1);
        }

        .music-player-box .now-playing .controls .play-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #4a6cf7;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(74, 108, 247, 0.25);
        }

        .music-player-box .now-playing .controls .play-btn:hover {
            background: #3a5bd9;
            transform: scale(1.05);
        }

        .music-player-box .now-playing .controls .play-btn.playing {
            background: #ef4444;
        }

        .music-player-box .now-playing .controls .play-btn.playing:hover {
            background: #dc2626;
        }

        .music-iframe-wrapper {
            display: none;
        }

        @media (max-width: 880px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 2.5rem;
            }
            .menu-icon {
                top: 1.2rem;
                left: 1.2rem;
            }
            .menu-dropdown {
                left: 1rem;
                right: 1rem;
                min-width: unset;
            }
        }

        @media (max-width: 550px) {
            .card {
                padding: 1.5rem 1rem;
            }
            .social-links a {
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
            }
            .menu-icon {
                top: 1rem;
                left: 1rem;
            }
            .menu-icon span {
                width: 24px;
                height: 3px;
            }
            .avatar-wrapper {
                max-width: 140px;
            }
            .menu-dropdown {
                padding: 1rem;
            }
            .music-player-box {
                padding: 1rem;
            }
            .music-player-box .now-playing {
                flex-wrap: wrap;
                justify-content: center;
            }
            .music-player-box .now-playing .info {
                text-align: center;
                width: 100%;
            }
            .mypages-section .mypages-link-box {
                flex-wrap: wrap;
            }
            .mypages-section .mypages-link-box .copy-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Menu 3 gạch - CHỈ HIỆN KHI CÓ ?edit=true -->
        <div class="menu-icon" id="menuIcon" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Menu dropdown -->
        <div class="menu-dropdown" id="menuDropdown">
            <label><i class="fas fa-user-circle"></i> Thay đổi avatar</label>
            <input type="file" id="avatarUpload" accept="image/*" onchange="updateAvatar(event)">
            
            <label><i class="fas fa-user"></i> Thay đổi tên</label>
            <input type="text" id="nameInput" placeholder="Nhập tên mới" value="Duc Anh">
            
            <label style="margin-top: 1.2rem;"><i class="fas fa-toggle-on"></i> Trạng thái</label>
            <div class="status-toggle-row">
                <div class="toggle-switch active" id="statusToggle" onclick="toggleStatus()">
                    <div class="toggle-slider"></div>
                </div>
                <span class="status-label" id="statusLabel">Online</span>
            </div>

            <label style="margin-top: 1.2rem;"><i class="fas fa-music"></i> Nhạc (link YouTube)</label>
            <input type="url" id="musicLink" placeholder="https://www.youtube.com/watch?v=..." value="https://www.youtube.com/watch?v=sC6yg7V8cSM">
            <input type="text" id="musicTitle" placeholder="Tên bài hát" value="Nhạc Chill TikTok" style="margin-top:0.3rem;">
            <input type="text" id="musicArtist" placeholder="Nghệ sĩ" value="Anten" style="margin-top:0.3rem;">
            
            <label style="margin-top: 1.2rem;"><i class="fas fa-link"></i> Link mạng xã hội</label>
            
            <div class="social-link-input">
                <i class="fab fa-facebook-f"></i>
                <input type="url" id="fbLink" placeholder="Link Facebook" value="#">
            </div>
            <div class="social-link-input">
                <i class="fab fa-youtube"></i>
                <input type="url" id="ytLink" placeholder="Link YouTube" value="#">
            </div>
            <div class="social-link-input">
                <i class="fas fa-comment" style="color: #0068ff;"></i>
                <input type="url" id="zaloLink" placeholder="Link Zalo" value="#">
            </div>
            <div class="social-link-input">
                <i class="fab fa-telegram"></i>
                <input type="url" id="teleLink" placeholder="Link Telegram" value="#">
            </div>
            <div class="social-link-input">
                <i class="fab fa-discord"></i>
                <input type="url" id="discordLink" placeholder="Link Discord" value="#">
            </div>

            <label style="margin-top: 1.2rem;"><i class="fas fa-globe"></i> MyPages</label>
            <div class="mypages-section">
                <div class="mypages-header">
                    <i class="fas fa-share-alt"></i>
                    <span>Chia sẻ trang cá nhân</span>
                </div>
                <div class="mypages-link-box">
                    <input type="text" id="mypagesLink" readonly value="Đang tải...">
                    <button class="copy-btn" onclick="copyLink()">
                        <i class="fas fa-copy"></i> Sao chép
                    </button>
                </div>
                <div class="mypages-note">
                    <i class="fas fa-info-circle"></i> Người khác xem sẽ không thấy menu 3 gạch
                </div>
            </div>
            
            <button class="btn-update" onclick="updateAll()"><i class="fas fa-save"></i> Cập nhật & Lưu</button>
        </div>

        <div class="profile-grid">
            <div class="avatar-section">
                <div class="avatar-wrapper">
                    <img class="avatar-img" id="avatarImage"
                         src="https://ui-avatars.com/api/?name=Duc+Anh&background=4a6cf7&color=fff&size=200&font-size=0.5" 
                         alt="Ảnh đại diện">
                </div>
                <div class="name-title">
                    <h1 id="displayName">Duc Anh</h1>
                    <span class="status-badge online" id="statusBadge">
                        <span class="status-dot"></span>
                        <span id="statusText">Online</span>
                    </span>
                </div>

                <div class="social-links">
                    <a href="#" id="fbLinkDisplay" target="_blank"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" id="ytLinkDisplay" target="_blank"><i class="fab fa-youtube"></i></a>
                    <a href="#" id="zaloLinkDisplay" target="_blank"><i class="fas fa-comment" style="color: #0068ff;"></i></a>
                    <a href="#" id="teleLinkDisplay" target="_blank"><i class="fab fa-telegram"></i></a>
                    <a href="#" id="discordLinkDisplay" target="_blank"><i class="fab fa-discord"></i></a>
                </div>

                <div class="music-player-box">
                    <div class="player-header">
                        <span><i class="fas fa-headphones"></i> MUSIC PLAYER</span>
                        <span>NOW PLAYING</span>
                    </div>
                    <div class="now-playing">
                        <div class="thumb">
                            <i class="fas fa-music"></i>
                        </div>
                        <div class="info">
                            <div class="title" id="musicDisplayTitle">Nhạc Chill TikTok</div>
                            <div class="sub" id="musicDisplayArtist">Anten</div>
                        </div>
                        <div class="controls">
                            <button onclick="toggleMusicPlayer()">
                                <i class="fas fa-stop"></i>
                            </button>
                            <button class="play-btn" id="playBtn" onclick="toggleMusicPlayer()">
                                <i class="fas fa-play" id="playIcon"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="music-iframe-wrapper">
                    <iframe id="musicIframe" src="" allow="autoplay; encrypted-media" style="width:0;height:0;border:none;"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Kiểm tra URL có ?edit=true không để hiển thị menu
        var urlParams = new URLSearchParams(window.location.search);
        var isEditMode = urlParams.get('edit') === 'true';
        
        if (isEditMode) {
            document.getElementById('menuIcon').classList.add('visible');
        }

        // Hàm toggle menu
        function toggleMenu() {
            var dropdown = document.getElementById('menuDropdown');
            dropdown.classList.toggle('active');
        }

        // Cập nhật link MyPages - LUÔN LÀ LINK GỐC (không có ?edit=true)
        function updateMypagesLink() {
            var currentUrl = window.location.href.split('?')[0];
            document.getElementById('mypagesLink').value = currentUrl;
        }

        // Các hàm khác
        function updateAvatar(event) {
            var file = event.target.files[0];
            if (file) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatarImage').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function toggleStatus() {
            var toggle = document.getElementById('statusToggle');
            var label = document.getElementById('statusLabel');
            var badge = document.getElementById('statusBadge');
            var text = document.getElementById('statusText');
            
            if (toggle.classList.contains('active')) {
                toggle.classList.remove('active');
                label.textContent = 'Offline';
                badge.className = 'status-badge offline';
                text.textContent = 'Offline';
            } else {
                toggle.classList.add('active');
                label.textContent = 'Online';
                badge.className = 'status-badge online';
                text.textContent = 'Online';
            }
        }

        function copyLink() {
            var linkInput = document.getElementById('mypagesLink');
            var copyBtn = event.target.closest('.copy-btn');
            
            linkInput.select();
            document.execCommand('copy');
            
            copyBtn.innerHTML = '<i class="fas fa-check"></i> Đã sao chép!';
            copyBtn.classList.add('copied');
            setTimeout(function() {
                copyBtn.innerHTML = '<i class="fas fa-copy"></i> Sao chép';
                copyBtn.classList.remove('copied');
            }, 2000);
        }

        function getEmbedUrl(url) {
            if (!url || url === '#') return '';
            if (url.includes('watch?v=')) {
                var videoId = url.split('watch?v=')[1]?.split('&')[0];
                if (videoId) return 'https://www.youtube.com/embed/' + videoId;
            } else if (url.includes('youtu.be/')) {
                var videoId = url.split('youtu.be/')[1]?.split('?')[0];
                if (videoId) return 'https://www.youtube.com/embed/' + videoId;
            }
            return url;
        }

        var isPlaying = false;
        var embedUrl = '';

        function toggleMusicPlayer() {
            var iframe = document.getElementById('musicIframe');
            var playBtn = document.getElementById('playBtn');
            var playIcon = document.getElementById('playIcon');
            
            if (!isPlaying) {
                var musicLink = document.getElementById('musicLink').value;
                embedUrl = getEmbedUrl(musicLink);
                if (embedUrl) {
                    iframe.src = embedUrl + '?autoplay=1&rel=0';
                    playBtn.classList.add('playing');
                    playIcon.className = 'fas fa-pause';
                    isPlaying = true;
                } else {
                    alert('Vui lòng cập nhật link nhạc trong menu!');
                }
            } else {
                iframe.src = '';
                playBtn.classList.remove('playing');
                playIcon.className = 'fas fa-play';
                isPlaying = false;
            }
        }

        function updateAll() {
            var newName = document.getElementById('nameInput').value.trim() || 'Duc Anh';
            document.getElementById('displayName').textContent = newName;
            
            var musicTitle = document.getElementById('musicTitle').value || 'YouTube Video';
            var musicArtist = document.getElementById('musicArtist').value || 'Artist';
            document.getElementById('musicDisplayTitle').textContent = musicTitle;
            document.getElementById('musicDisplayArtist').textContent = musicArtist;
            
            var fb = document.getElementById('fbLink').value || '#';
            var yt = document.getElementById('ytLink').value || '#';
            var zalo = document.getElementById('zaloLink').value || '#';
            var tele = document.getElementById('teleLink').value || '#';
            var discord = document.getElementById('discordLink').value || '#';

            document.getElementById('fbLinkDisplay').href = fb;
            document.getElementById('ytLinkDisplay').href = yt;
            document.getElementById('zaloLinkDisplay').href = zalo;
            document.getElementById('teleLinkDisplay').href = tele;
            document.getElementById('discordLinkDisplay').href = discord;

            // Cập nhật link MyPages (luôn là link gốc)
            updateMypagesLink();

            // Đóng menu
            document.getElementById('menuDropdown').classList.remove('active');
        }

        // Tự động cập nhật link khi load trang
        window.onload = function() {
            updateMypagesLink();
        };
    </script>
</body>
</html>
